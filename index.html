<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRT IOS - PANEL VIP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:#000000;
  color:#cfe3f5;
  font-family:system-ui,-apple-system,sans-serif;
  overflow-x:hidden;
  position:relative;
}

.bg-animation {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1; pointer-events: none; overflow: hidden;
  background: radial-gradient(circle at center, #070e18 0%, #000000 90%);
}

.ff-item {
  position: absolute; height: auto; pointer-events: none;
  animation: floatItem 10s infinite ease-in-out; object-fit: contain;
  background: transparent; border-radius: 14px;
}

.vid-personajes { top: 8%; left: 11%; width: 380px; animation-duration: 9s; filter: drop-shadow(0 0 20px rgba(249, 115, 22, 0.6)); }
.vid-rgb { top: 8%; right: 11%; left: auto; width: 380px; animation-duration: 11s; animation-delay: -3s; filter: drop-shadow(0 0 22px rgba(14, 165, 233, 0.6)); }
.vid-neblusa { bottom: 8%; right: 11%; top: auto; left: auto; width: 380px; animation-duration: 12s; animation-delay: -5s; filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.6)); }
.vid-cuadros { bottom: 8%; left: 11%; top: auto; width: 380px; animation-duration: 10s; animation-delay: -2s; filter: drop-shadow(0 0 24px rgba(34, 197, 94, 0.6)); }

@keyframes floatItem {
  0% { transform: translateY(0px) rotate(0deg) scale(1); }
  50% { transform: translateY(-15px) rotate(2deg) scale(1.02); }
  100% { transform: translateY(0px) rotate(0deg) scale(1); }
}

@keyframes rgbText {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.rgb-text {
  background: linear-gradient(90deg, #ff0055, #7000ff, #00d4ff, #00ff66, #ff0055);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rgbText 4s ease infinite;
}

.rgb-text-sub {
  background: linear-gradient(90deg, #00f2fe, #4facfe, #0000ff, #00f2fe);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rgbText 5s ease infinite;
}

.rgb-text-foot {
  background: linear-gradient(90deg, #ff8a00, #e52e71, #9b51e0, #ff8a00);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rgbText 6s ease infinite;
}

#login { display: grid; place-items: center; min-height: 100vh; padding: 18px; position: relative; z-index: 2; }

.lg {
  position: relative; padding: 40px 32px; background: rgba(8, 15, 26, 0.85);
  border-radius: 24px; backdrop-filter: blur(16px);
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 2px rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(14, 165, 233, 0.25); width: min(440px, 100%); text-align: center; overflow: hidden;
}

.lg::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, #ff0055, #7000ff, #00d4ff, #00ff66, #ff0055);
  background-size: 300% 300%; animation: rgbText 4s ease infinite;
}

.icon-lock {
  width: 48px; height: 48px; margin: 0 auto 12px; background: rgba(14, 165, 233, 0.1);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(14, 165, 233, 0.3); box-shadow: 0 0 15px rgba(14, 165, 233, 0.2);
}

.logo { font-size: 2.3rem; font-weight: 900; letter-spacing: .25em; text-transform: uppercase; margin-bottom: 4px; }
.sub { margin-top: 6px; font-size: .75rem; letter-spacing: .18em; font-weight: 700; text-transform: uppercase; }
.line { height: 2px; margin: 24px auto; width: 80px; background: linear-gradient(90deg, transparent, #0ea5e9, transparent); }
.lab { display: block; text-align: left; font-size: .72rem; font-weight: 800; letter-spacing: .15em; color: #7dd3fc; margin-bottom: 10px; text-transform: uppercase; }

#key {
  text-transform: uppercase; letter-spacing: .15em; text-align: center; font-weight: 700; font-size: 1rem;
  width: 100%; padding: 16px; border-radius: 14px; border: 1px solid #1e3a5f;
  background: rgba(0, 0, 0, 0.7); color: #fff; margin-bottom: 12px; transition: all 0.3s ease;
}

#key:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; margin-top: 14px; padding: 18px 24px; border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px; background: rgba(10, 20, 32, 0.85); backdrop-filter: blur(10px);
  font-size: 0.98rem; font-weight: 800; cursor: pointer; transition: all 0.3s ease;
}

.btn:hover { transform: translateY(-2px) scale(1.01); border-color: rgba(14, 165, 233, 0.5); }

.btn-rgb-text {
  background: linear-gradient(90deg, #00f2fe, #4facfe, #00ff66, #ff0055, #7000ff);
  background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: rgbText 4s ease infinite;
}

.foot { margin-top: 26px; font-size: .68rem; letter-spacing: .14em; font-weight: 700; text-transform: uppercase; }
.err { color: #f87171; min-height: 1.2em; font-size: .88rem; font-weight: 600; margin-bottom: 6px; }

#panel { display: none; min-height: 100vh; width: 100%; position: relative; z-index: 2; align-items: center; justify-content: center; }

header { 
  position: fixed; top: 0; left: 0; width: 100%; padding: 18px 24px; 
  background: rgba(8, 15, 26, 0.9); border-bottom: 1px solid rgba(14, 165, 233, 0.2); 
  backdrop-filter: blur(12px); z-index: 10; display: flex; justify-content: space-between; align-items: center;
}

header h1 { font-size: 1.35rem; color: #fff; }

.header-links { display: flex; gap: 10px; align-items: center; }

.badge-link {
  display: inline-block; padding: 6px 14px; border-radius: 8px;
  background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.5);
  color: #38bdf8; font-size: .75rem; font-weight: 800; text-decoration: none; transition: all 0.2s ease;
}

.badge-link:hover {
  background: rgba(14, 165, 233, 0.35); border-color: #38bdf8; color: #ffffff;
  box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
}

.online { margin-left: 12px; font-size: .9rem; color: #9bb4cc; }
.online:before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #22c55e; margin-right: 6px; }

.wrap { width: min(480px, 92%); margin: 0 auto; }
.box { padding: 32px 28px; border: 1px solid rgba(14, 165, 233, 0.3); border-radius: 28px; background: rgba(8, 15, 26, 0.88); backdrop-filter: blur(20px); }
.title { font-size: .88rem; font-weight: 800; letter-spacing: .18em; color: #7dd3fc; margin-bottom: 22px; text-align: center; text-transform: uppercase; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(10px); z-index: 1000; place-items: center; padding: 18px; }
.modal-content { width: min(480px, 100%); background: rgba(8, 15, 26, 0.95); border: 1px solid rgba(14, 165, 233, 0.4); border-radius: 24px; padding: 28px; text-align: center; position: relative; }
.close-btn { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #7dd3fc; font-size: 1.6rem; cursor: pointer; }
.close-btn:hover { color: #ff0055; }
</style>
</head>
<body>

<div class="bg-animation">
  <video src="/uploads/PERSONAJES.MP4" class="ff-item vid-personajes" autoplay loop muted playsinline></video>
  <video src="/uploads/RGB.MP4" class="ff-item vid-rgb" autoplay loop muted playsinline></video>
  <video src="/uploads/NEBLUSA.MP4" class="ff-item vid-neblusa" autoplay loop muted playsinline></video>
  <video src="/uploads/CUADROS.MP4" class="ff-item vid-cuadros" autoplay loop muted playsinline></video>
</div>

<div id="login">
  <div class="lg">
    <div class="icon-lock">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <div class="logo rgb-text">DRT IOS</div>
    <div class="sub rgb-text-sub">LA MEJOR OPCIÓN PARA COMPRAR ARCHIVOS</div>
    <div class="line"></div>
    <label class="lab" for="key">🔑 CLAVE DE ACCESO VIP</label>
    <input type="password" id="key" placeholder="INGRESA TU KEY AQUÍ" autocomplete="off" onkeydown="if(event.key==='Enter')entrar()">
    <div class="err" id="err"></div>
    <button class="btn" onclick="entrar()"><span class="btn-rgb-text">VALIDAR ACCESO VIP</span></button>
    <div class="foot rgb-text-foot">ACCESO VÍNCULADO A UN SOLO DISPOSITIVO</div>
  </div>
</div>

<div id="panel">
  <header>
    <div>
      <h1 class="rgb-text" style="display:inline-block;">DRT IOS</h1>
      <span class="online">Online</span>
    </div>
    <div class="header-links">
      <a href="https://t.me/TT_DRTIOS1" target="_blank" class="badge-link">PERFIL</a>
      <a href="https://t.me/TT_DRTIOS1" target="_blank" class="badge-link">SOPORTE</a>
    </div>
  </header>
  <div class="wrap">
    <div class="box">
      <div class="title rgb-text-sub">ELIGE TU ARCHIVO DRT IOS</div>
      
      <button class="btn" onclick="descargar('holograma_pj')">
        <span>🔥</span><span class="btn-rgb-text">HOLOGRAMA PERSONAJES</span>
      </button>

      <button class="btn" onclick="abrirSubMenuArmas()">
        <span>🔫</span><span class="btn-rgb-text">HOLOGRAMA ARMAS EXCLUSIVE</span>
      </button>

      <button class="btn" onclick="descargar('wallhack')">
        <span>⚡</span><span class="btn-rgb-text">WALLHACK VIP</span>
      </button>

      <button class="btn" onclick="abrirSubMenuAimbots()">
        <span>🎯</span><span class="btn-rgb-text">AIMBOTS EXCLUSIVE</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal Armas -->
<div class="modal-overlay" id="modalArmas">
  <div class="modal-content">
    <button class="close-btn" onclick="cerrarSubMenuArmas()">&times;</button>
    <div class="title rgb-text" style="margin-top:10px;">SELECCIONA HOLOGRAMA ARMAS</div>
    <button class="btn" onclick="descargar('armas_cuadros')"><span>🎨</span><span class="btn-rgb-text">CUADROS EXCLUSIVE</span></button>
    <button class="btn" onclick="descargar('armas_rgb')"><span>🌈</span><span class="btn-rgb-text">RGB EXCLUSIVE</span></button>
    <button class="btn" onclick="descargar('armas_tocino')"><span>🥓</span><span class="btn-rgb-text">TOCINO EXCLUSIVO</span></button>
    <button class="btn" onclick="descargar('armas_neblina')"><span>☁️</span><span class="btn-rgb-text">NEBLUSA EXCLUSIVO</span></button>
  </div>
</div>

<!-- Modal Aimbots -->
<div class="modal-overlay" id="modalAimbots">
  <div class="modal-content">
    <button class="close-btn" onclick="cerrarSubMenuAimbots()">&times;</button>
    <div class="title rgb-text" style="margin-top:10px;">SELECCIONA TIPO DE AIMBOT</div>
    <button class="btn" onclick="descargar('aimbot_body')"><span>🛡</span><span class="btn-rgb-text">AIMBOT BODY DISIMULADO</span></button>
    <button class="btn" onclick="descargar('aimbot_neck')"><span>👔</span><span class="btn-rgb-text">AIMBOT NECK</span></button>
    <button class="btn" onclick="descargar('aimbot_drag')"><span>🎯</span><span class="btn-rgb-text">AIMBOT AIM DRAG</span></button>
    <button class="btn" onclick="descargar('aimbot_head')"><span>💀</span><span class="btn-rgb-text">AIMBOT HEAD</span></button>
  </div>
</div>

<script>
let token = "";
let expirationDate = null;

// Obtiene o genera una huella única para el dispositivo actual
function getDeviceId() {
  let devId = localStorage.getItem("drt_device_id");
  if (!devId) {
    devId = "DEV-" + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem("drt_device_id", devId);
  }
  return devId;
}

function logout(mensaje = "TU SESIÓN O KEY HA EXPIRADO") {
  token = "";
  expirationDate = null;
  document.getElementById("login").style.display = "grid";
  document.getElementById("panel").style.display = "none";
  document.getElementById("err").textContent = mensaje;
}

async function entrar() {
  const keyInput = document.getElementById("key");
  const errDiv = document.getElementById("err");
  const loginDiv = document.getElementById("login");
  const panelDiv = document.getElementById("panel");

  errDiv.textContent = "";

  try {
    const r = await fetch("/api/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        key: keyInput.value,
        device_id: getDeviceId()
      })
    });

    const data = await r.json();

    if (!r.ok) {
      errDiv.textContent = data.detail || "KEY INVÁLIDA";
      return;
    }

    token = data.token;
    expirationDate = new Date(data.expires_at);

    loginDiv.style.display = "none";
    panelDiv.style.display = "flex";

    // Verificación constante de expiración en tiempo real
    iniciarControlExpiracion();
  } catch(e) {
    errDiv.textContent = "ERROR DE CONEXIÓN CON EL SERVIDOR";
  }
}

function iniciarControlExpiracion() {
  const timer = setInterval(() => {
    if (!expirationDate || new Date() > expirationDate) {
      clearInterval(timer);
      logout("TU KEY HA EXPIRADO. RENUEVA TU ACCESO.");
    }
  }, 5000); // Revisa cada 5 segundos
}

function abrirSubMenuArmas() { document.getElementById("modalArmas").style.display = "grid"; }
function cerrarSubMenuArmas() { document.getElementById("modalArmas").style.display = "none"; }
function abrirSubMenuAimbots() { document.getElementById("modalAimbots").style.display = "grid"; }
function cerrarSubMenuAimbots() { document.getElementById("modalAimbots").style.display = "none"; }

function descargar(fileKey) {
  if (!token) {
    logout();
    return;
  }
  window.location.href = `/api/download/${fileKey}?token=${token}&device_id=${getDeviceId()}`;
}
</script>
</body>
</html>
